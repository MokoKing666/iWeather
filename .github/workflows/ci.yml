name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 密钥通过仓库 Secrets 注入，不进版本库。
      # 没配也能跑：BuildConfig 里的字段会是空串，单元测试不依赖真实密钥。
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${{ secrets.CAIYUN_TOKEN }}" ]; then
            echo "caiyun.token=${{ secrets.CAIYUN_TOKEN }}" >> local.properties
          fi
          if [ -n "${{ secrets.AMAP_KEY }}" ]; then
            echo "amap.key=${{ secrets.AMAP_KEY }}" >> local.properties
          fi

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html